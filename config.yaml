# Konfiguration för AI-aktieexperimentet. Allt simulerat, inga riktiga order.

# Startkapital sätts EN gång vid första körningen och fryses i data/meta.json.
# Att ändra här efteråt påverkar ingenting — det är avsiktligt.
start_capital_sek: 100000

# Jämförelseindex. OMXS30 på Yahoo Finance.
benchmark_ticker: "^OMX"

fees:
  commission_pct: 0.0025      # 0,25 % av affärens bruttovärde
  commission_min_sek: 1.0     # minimicourtage per affär
  spread_pct: 0.0010          # 0,10 % total spread; halva läggs på vardera håll

risk:
  max_position_pct: 0.20      # max 20 % av totalt portföljvärde per aktie
  min_trade_sek: 1000         # minsta affärsstorlek; mindre förslag avvisas
  max_proposals_per_run: 3    # tak på antal förslag som bokförs per körning

schedule:
  timezone: "Europe/Stockholm"
  slots:
    morning: "09:15"
    midday: "12:30"
    close: "17:00"
  # GitHub Actions kan försena schemalagda jobb kraftigt. En körning accepteras
  # om den startar inom detta antal minuter efter slottens klockslag.
  tolerance_minutes: 75

market:
  open: "09:00"
  close: "17:30"
  # Dagar då Stockholmsbörsen är helt stängd. Fyll på inför varje nytt år.
  holidays:
    - "2026-01-01"
    - "2026-01-06"
    - "2026-04-03"
    - "2026-04-06"
    - "2026-05-01"
    - "2026-05-14"
    - "2026-06-19"
    - "2026-12-24"
    - "2026-12-25"
    - "2026-12-31"
    - "2027-01-01"
    - "2027-01-06"
    - "2027-03-26"
    - "2027-03-29"
    - "2027-05-06"
    - "2027-06-25"
    - "2027-12-24"
    - "2027-12-31"
  # Halvdagar: börsen stänger tidigt. Slots efter stängning hoppas över.
  early_close:
    "2026-01-05": "13:00"
    "2026-04-02": "13:00"
    "2026-04-30": "13:00"
    "2026-05-13": "13:00"
    "2026-06-18": "13:00"
    "2026-10-30": "13:00"
    "2026-12-23": "13:00"
    "2026-12-30": "13:00"
    "2027-01-05": "13:00"
    "2027-03-25": "13:00"
    "2027-04-30": "13:00"
    "2027-05-05": "13:00"
    "2027-06-24": "13:00"
    "2027-11-05": "13:00"
    "2027-12-23": "13:00"
    "2027-12-30": "13:00"

model:
  name: "claude-sonnet-5-5"
  max_tokens: 8000
  effort: "medium"
  # Serverside-fallback vid avböjt svar. Koden gör automatiskt ett vanligt
  # anrop i stället om beta-flaggan inte accepteras. Sätt false för att
  # aldrig skicka den.
  server_side_fallback: true

data:
  # Antal handelsdagar historik som skickas till modellen som underlag.
  history_days: 60
  # Hur gammal senaste kursen får vara (handelsdagar) innan rundan hoppas över.
  max_staleness_days: 3
